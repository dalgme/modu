# 배포 화면 스모크 점검 (P34-A) — docs/SMOKE-TEST.md
#
# 무엇을 하나: Vercel 이 배포를 마치면(Production·Preview 모두) 그 URL 에 점검 계정 4개(발주처·운영사·멘토·멘티)로
# 실제 로그인해 주요 화면을 전부 열어 보고, 500 / "Application error" / 로그인 튕김 / 런타임 오류가 하나라도 있으면 실패시킨다.
# 실패하면 해당 커밋에 빨간 X 가 남는다 → "운영 반영(main 푸시) 금지" 신호로 삼는다.
#
# 설정 순서 (한 번만)
#  1) 비밀값 2개를 만든다: SMOKE_SEED_TOKEN = `openssl rand -hex 32`, SMOKE_PASSWORD = 8자 이상 아무 문자열
#  2) Vercel 프로젝트 modu → Settings → Environment Variables 에 두 값을 **Production·Preview 모두** Secret 으로 추가 → 재배포
#     (시드 API `/api/ops/smoke-seed` 가 이 값으로 토큰을 검증하고 점검 계정 비밀번호를 정한다)
#  3) GitHub 저장소 → Settings → Secrets and variables → Actions 에 같은 이름·같은 값으로 시크릿 2개 추가
#     - SMOKE_PASSWORD  (필수)  점검 계정 로그인 비밀번호
#     - SMOKE_SEED_TOKEN (권장) 없으면 시드를 건너뛰고 계정이 이미 있다고 가정한다
#  4) Vercel ↔ GitHub 연동이 켜져 있으면(현재 켜짐) 배포 완료 시 `deployment_status` 이벤트가 오고 이 워크플로가 자동 실행된다.
#     수동 실행은 Actions 탭 → "Smoke (deployed URL)" → Run workflow → base_url 입력.
#
# 결과 보는 법: Actions 탭 → 실패한 실행 → 하단 Artifacts 의 `playwright-report-*` 를 내려받아 index.html 을 연다(스크린샷·트레이스 포함).

name: Smoke (deployed URL)

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: '점검할 배포 URL (예: https://modu-dalgmes-projects.vercel.app)'
        required: true
        type: string

# 전역 직렬화 — 작업 브랜치 푸시 + main 푸시가 배포 2개(Preview·Production)를 만들면 스모크 2건이 동시에 뜨는데,
# 둘 다 같은 점검 계정 4개로 로그인하고 같은 시드를 돌려 서로의 세션을 깨뜨렸다(2026-09-28 run #6·#7: 시드의 비밀번호 재설정이
# 먼저 로그인한 쪽의 세션을 무효화 → 발주처·운영사 화면 전부 /login 튕김). 한 번에 하나만 돌리고 나머지는 대기시킨다.
concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    # deployment_status 는 배포 성공(success) 일 때만. workflow_dispatch 는 항상.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success' }}
    name: smoke (${{ github.event.deployment.environment || 'manual' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMOKE_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.base_url }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      SMOKE_SEED_TOKEN: ${{ secrets.SMOKE_SEED_TOKEN }}
      # (선택) Vercel Deployment Protection 우회 — 프로젝트 Settings → Deployment Protection → Protection Bypass for Automation 의 값
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      CI: 'true'
    steps:
      - name: 점검 대상 출력
        run: |
          echo "event=${{ github.event_name }} environment=${{ github.event.deployment.environment || 'manual' }}"
          echo "base_url=${SMOKE_BASE_URL}"
          if [ -z "${SMOKE_BASE_URL}" ]; then echo "::error::배포 URL 이 비어 있습니다"; exit 1; fi
          if [ -z "${SMOKE_PASSWORD}" ]; then echo "::error::GitHub 시크릿 SMOKE_PASSWORD 가 없습니다 (docs/SMOKE-TEST.md)"; exit 1; fi
          if [ -z "${SMOKE_SEED_TOKEN}" ]; then echo "::warning::SMOKE_SEED_TOKEN 시크릿이 없어 시드를 건너뜁니다 — 점검 계정이 이미 있어야 합니다"; fi

      - uses: actions/checkout@v4
        with:
          # deployment_status 이벤트는 기본 브랜치 기준으로 실행되므로 배포된 커밋을 명시적으로 체크아웃한다
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치 (chromium)
        run: npx playwright install --with-deps chromium

      - name: 스모크 실행
        run: npm run smoke

      - name: 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.deployment.environment || 'manual' }}-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
